services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    volumes:
      - .:/var/www/html
    networks:
      - laravel_net

  webserver:
    image: nginx:alpine
    container_name: laravel_web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel_net

  mysql:
    image: mysql:8.0
    container_name: laravel_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    networks:
      - laravel_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: laravel_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
    networks:
      - laravel_net

  beto:
    build: ./beto_service
    container_name: beto_service
    restart: unless-stopped
    networks:
      - laravel_net

  chatbot:
    build:
      context: ./chatbot/chatbot
      dockerfile: Dockerfile
    container_name: mentally_pg_chatbot
    ports:
      - "5000:5000"
    volumes:
      - ./chatbot/chatbot/app:/app
      - ./chatbot/chatbot/model:/app/model
    networks:
      - laravel_net

networks:
  laravel_net:
    driver: bridge